name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, unit, e2e)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mongo:
        image: mongo:6
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint:check
      - run: npm test
      - run: npm run build
      - name: Tests e2e
        run: npm run test:e2e -- --runInBand --forceExit
        env:
          MONGO_URI: mongodb://localhost:27017/miniapp-test

  frontend:
    name: Frontend (build, unit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run test:ci

  cypress:
    name: Frontend (Cypress)
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      # Servidor de desarrollo en IPv4 explícito (evita que localhost resuelva a ::1)
      - name: Arrancar servidor de desarrollo
        working-directory: frontend
        run: |
          npx ng serve --host 127.0.0.1 --port 4200 > ng-serve.log 2>&1 &
          npx --yes wait-on@8 --timeout 180000 http-get://127.0.0.1:4200
      - name: Tests Cypress
        working-directory: frontend
        run: npx cypress run
        env:
          CYPRESS_BASE_URL: http://127.0.0.1:4200
      - name: Log del servidor
        if: failure()
        run: cat frontend/ng-serve.log
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: cypress-screenshots
          path: frontend/cypress/screenshots
          if-no-files-found: ignore

  docker:
    name: Imágenes Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose build
