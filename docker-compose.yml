services:
  mongo:
    image: mongo:6
    container_name: mongo
    # Sin puertos publicados: solo accesible desde la red interna de Docker.
    # Para desarrollo local, ver docker-compose.dev.yml
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER:-miniapp}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD:-miniapp-dev-password}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    # Sin puertos publicados: se accede a través de Nginx (/api)
    environment:
      - MONGO_URI=mongodb://${MONGO_USER:-miniapp}:${MONGO_PASSWORD:-miniapp-dev-password}@mongo:27017/miniapp?authSource=admin
      - JWT_SECRET=${JWT_SECRET:-dev-secret-change-me}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-dev-refresh-secret-change-me}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:4200}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@miniapp.local}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - LOGIN_RATE_LIMIT=${LOGIN_RATE_LIMIT:-5}
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - '80:80'
    depends_on:
      - backend

volumes:
  mongo_data:
